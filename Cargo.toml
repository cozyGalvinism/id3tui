[package]
name = "id3tui"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["cozyGalvinism"]
description = "A terminal user interface for editing ID3v2 tags and audio metadata"
repository = "https://github.com/cozygalvinism/id3tui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
id3 = "1.14"
metaflac = "0.2"
mp4ameta = "0.11"
anyhow = "1.0"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
